upstream catalog_backend {
    server catalog-1:8002;
    server catalog-2:8002;
}

upstream graphql_backend {
    server graphql:8005;
}

server {
    listen 80;
    server_name localhost;

    location /health {
        return 200 'Nginx is running';
        add_header Content-Type text/plain;
    }

    location = /openapi.json {
        proxy_pass http://auth:8001/openapi.json;
    }
    
    location = /catalog/openapi.json {
        proxy_pass http://catalog_backend/openapi.json;
    }

    location /auth/ {
        proxy_pass http://auth:8001/;
    }
    
    location /catalog/ {
        proxy_pass http://catalog_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
        location /graphql {
        proxy_pass http://graphql_backend/graphql;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}