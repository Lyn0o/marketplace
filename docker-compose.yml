services:
  consul:
    image: hashicorp/consul:latest
    container_name: consul
    ports: ["8500:8500"]
    command: agent -server -ui -bootstrap-expect=1 -client "0.0.0.0"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth:
    build: ./auth_service
    container_name: auth
    environment:
      - SERVICE_NAME=auth-service
      - INSTANCE_ID=auth-1
      - PORT=8001
      - SERVICE_HOST=auth
      - CONSUL_URL=http://consul:8500
    depends_on: [consul]
    restart: on-failure

  catalog-1:
    build: ./catalog_service
    container_name: catalog-1
    environment:
      - INSTANCE_ID=catalog-1
      - PORT=8002
      - SERVICE_HOST=catalog-1
      - CONSUL_URL=http://consul:8500
    depends_on: [consul]
    restart: on-failure

  catalog-2:
    build: ./catalog_service
    container_name: catalog-2
    environment:
      - INSTANCE_ID=catalog-2
      - PORT=8002
      - SERVICE_HOST=catalog-2
      - CONSUL_URL=http://consul:8500
    depends_on: [consul]
    restart: on-failure

  order:
    build: ./order_service
    container_name: order
    environment:
      - SERVICE_NAME=order-service
      - INSTANCE_ID=order-1
      - PORT=8003
      - SERVICE_HOST=order
      - CONSUL_URL=http://consul:8500
      - RABBIT_URL=amqp://guest:guest@rabbitmq/
    depends_on:
      rabbitmq: {condition: service_healthy}
      consul:   {condition: service_started}
    restart: on-failure

  payment:
    build: ./payment_service
    container_name: payment
    ports:
      - "50051:50051"
    environment:
      - SERVICE_NAME=payment-service
      - INSTANCE_ID=payment-1
      - PORT=8004
      - SERVICE_HOST=payment
      - CONSUL_URL=http://consul:8500
      - RABBIT_URL=amqp://guest:guest@rabbitmq/
      - FAILURE_RATE=0.3
    depends_on:
      rabbitmq: {condition: service_healthy}
      consul:   {condition: service_started}
    restart: on-failure

  notification:
    build: ./notification_service
    container_name: notification
    environment:
      - SERVICE_NAME=notification-service
      - INSTANCE_ID=notification-1
      - PORT=8006
      - SERVICE_HOST=notification
      - CONSUL_URL=http://consul:8500
      - RABBIT_URL=amqp://guest:guest@rabbitmq/
    depends_on:
      rabbitmq: {condition: service_healthy}
      consul:   {condition: service_started}
    restart: on-failure

  nginx:
    image: nginx:latest
    container_name: nginx
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on: [auth, catalog-1, catalog-2, order, payment, notification]
    restart: unless-stopped

  graphql:
    build: ./graphql_gateway
    container_name: graphql
    environment:
      - SERVICE_NAME=graphql-gateway
      - INSTANCE_ID=graphql-1
      - PORT=8005
      - SERVICE_HOST=graphql
      - CONSUL_URL=http://consul:8500
    depends_on: [consul, order]
    restart: on-failure