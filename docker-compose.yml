services:
  consul:
    image: hashicorp/consul:latest
    container_name: consul
    ports: ["8500:8500"]
    command: agent -server -ui -bootstrap-expect=1 -client "0.0.0.0"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth:
    build: ./auth_service
    container_name: auth
    environment:
      - SERVICE_NAME=auth-service
      - INSTANCE_ID=auth-1
      - PORT=8001
      - SERVICE_HOST=auth
      - CONSUL_URL=http://consul:8500
    depends_on: [consul]
    restart: on-failure

  catalog-1:
    build: ./catalog_service
    container_name: catalog-1
    environment:
      - INSTANCE_ID=catalog-1
      - PORT=8002
      - SERVICE_HOST=catalog-1
      - CONSUL_URL=http://consul:8500
    depends_on: [consul]
    restart: on-failure

  catalog-2:
    build: ./catalog_service
    container_name: catalog-2
    environment:
      - INSTANCE_ID=catalog-2
      - PORT=8002
      - SERVICE_HOST=catalog-2
      - CONSUL_URL=http://consul:8500
    depends_on: [consul]
    restart: on-failure

  order:
    build: ./order_service
    container_name: order
    ports:
      - "8003:8003"
    environment:
      - SERVICE_NAME=order-service
      - INSTANCE_ID=order-1
      - PORT=8003
      - SERVICE_HOST=order
      - CONSUL_URL=http://consul:8500
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      kafka: {condition: service_started}
      rabbitmq: {condition: service_healthy}
      consul: {condition: service_started}
    restart: on-failure

  payment:
    build: ./payment_service
    container_name: payment
    ports:
      - "50051:50051"
    environment:
      - SERVICE_NAME=payment-service
      - INSTANCE_ID=payment-1
      - PORT=8004
      - SERVICE_HOST=payment
      - CONSUL_URL=http://consul:8500
      - RABBIT_URL=amqp://guest:guest@rabbitmq/
      - FAILURE_RATE=0.3
    depends_on:
      rabbitmq: {condition: service_healthy}
      consul:   {condition: service_started}
    restart: on-failure

  notification:
    build: ./notification_service
    container_name: notification
    environment:
      - SERVICE_NAME=notification-service
      - INSTANCE_ID=notification-1
      - PORT=8006
      - SERVICE_HOST=notification
      - CONSUL_URL=http://consul:8500
      - RABBIT_URL=amqp://guest:guest@rabbitmq/
    depends_on:
      rabbitmq: {condition: service_healthy}
      consul:   {condition: service_started}
    restart: on-failure

  nginx:
    image: nginx:latest
    container_name: nginx
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on: [auth, catalog-1, catalog-2, order, payment, notification]
    restart: unless-stopped

  graphql:
    build: ./graphql_gateway
    container_name: graphql
    environment:
      - SERVICE_NAME=graphql-gateway
      - INSTANCE_ID=graphql-1
      - PORT=8005
      - SERVICE_HOST=graphql
      - CONSUL_URL=http://consul:8500
    depends_on: [consul, order]
    restart: on-failure

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on: [kafka]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    restart: unless-stopped