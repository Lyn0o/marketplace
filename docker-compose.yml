x-app: &app
  build: .
  restart: unless-stopped
  environment: &env
    JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    RABBIT_URL: amqp://guest:guest@rabbitmq/
    KAFKA_BOOTSTRAP: kafka:9092
    CONSUL_URL: http://consul:8500
  volumes:
    - app-data:/data

services:
  consul:
    image: hashicorp/consul:1.20
    command: agent -server -ui -bootstrap-expect=1 -client 0.0.0.0
    ports: ["127.0.0.1:8500:8500"]
  rabbitmq:
    image: rabbitmq:3-management
    depends_on:
      rabbit-data-init: {condition: service_completed_successfully}
    ports: ["127.0.0.1:15672:15672"]
    volumes: ["rabbit-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  rabbit-data-init:
    image: rabbitmq:3-management
    user: "0:0"
    entrypoint: /bin/sh
    command: ["-c", "chown -R rabbitmq:rabbitmq /var/lib/rabbitmq"]
    volumes: ["rabbit-data:/var/lib/rabbitmq"]
  kafka-data-init:
    image: apache/kafka:3.9.0
    user: "0:0"
    entrypoint: /bin/sh
    command: ["-c", "chown -R 1000:1000 /data"]
    volumes: ["kafka-data:/data"]
  kafka:
    image: apache/kafka:3.9.0
    depends_on:
      kafka-data-init: {condition: service_completed_successfully}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes: ["kafka-data:/tmp/kraft-combined-logs"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 20
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: /bin/sh
    command: ["-c", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders-events --partitions 3 --replication-factor 1"]
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports: ["127.0.0.1:8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: marketplace
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka-init: {condition: service_completed_successfully}
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  auth:
    <<: *app
    command: uvicorn auth_service.main:app --host 0.0.0.0 --port 8001
  catalog-1:
    <<: *app
    command: uvicorn catalog_service.main:app --host 0.0.0.0 --port 8002
    environment:
      <<: *env
      INSTANCE_ID: catalog-1
  catalog-2:
    <<: *app
    command: uvicorn catalog_service.main:app --host 0.0.0.0 --port 8002
    environment:
      <<: *env
      INSTANCE_ID: catalog-2
  order:
    <<: *app
    command: uvicorn order_service.main:app --host 0.0.0.0 --port 8003
    depends_on:
      rabbitmq: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
  payment:
    <<: *app
    command: uvicorn payment_service.main:app --host 0.0.0.0 --port 8004
    environment:
      <<: *env
      FAILURE_RATE: ${FAILURE_RATE:-0}
    depends_on:
      rabbitmq: {condition: service_healthy}
  notification:
    <<: *app
    command: uvicorn notification_service.main:app --host 0.0.0.0 --port 8006
    depends_on:
      rabbitmq: {condition: service_healthy}
  analytics:
    <<: *app
    command: uvicorn analytics_service.main:app --host 0.0.0.0 --port 8007
    depends_on:
      kafka-init: {condition: service_completed_successfully}
  graphql:
    <<: *app
    command: uvicorn graphql_gateway.main:app --host 0.0.0.0 --port 8005
  gateway:
    <<: *app
    command: uvicorn api_gateway.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers
    environment:
      <<: *env
      REDIS_URL: redis://redis:6379
      RATE_LIMIT: ${RATE_LIMIT:-60}
      RATE_WINDOW: ${RATE_WINDOW:-60}
    depends_on:
      redis: {condition: service_healthy}
      auth: {condition: service_started}
  nginx:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:80:80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [gateway]

volumes:
  app-data:
  kafka-data:
  rabbit-data:
