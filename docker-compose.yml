name: labs79
x-app: &app
  image: marketplace-labs79
  build: .
  restart: unless-stopped
  environment: &env
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set DB password}
    JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    RABBIT_URL: amqp://guest:guest@rabbitmq/
    KAFKA_BOOTSTRAP: kafka:9092
    CONSUL_URL: http://consul:8500
  volumes:
    - app-data:/data

services:
  consul:
    image: hashicorp/consul:1.20
    command: agent -server -ui -bootstrap-expect=1 -client 0.0.0.0
    ports: ["127.0.0.1:18500:8500"]
  rabbitmq:
    restart: on-failure
    image: rabbitmq:3-management
    depends_on:
      rabbit-data-init: {condition: service_completed_successfully}
    ports: ["127.0.0.1:18672:15672"]
    volumes: ["rabbit-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  rabbit-data-init:
    image: rabbitmq:3-management
    user: "0:0"
    entrypoint: /bin/sh
    command: ["-c", "chown -R rabbitmq:rabbitmq /var/lib/rabbitmq"]
    volumes: ["rabbit-data:/var/lib/rabbitmq"]
  kafka-data-init:
    image: apache/kafka:3.9.0
    user: "0:0"
    entrypoint: /bin/sh
    command: ["-c", "chown -R 1000:1000 /data"]
    volumes: ["kafka-data:/data"]
  kafka:
    image: apache/kafka:3.9.0
    depends_on:
      kafka-data-init: {condition: service_completed_successfully}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes: ["kafka-data:/tmp/kraft-combined-logs"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 20
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: /bin/sh
    command: ["-c", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders-events --partitions 3 --replication-factor 1"]
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports: ["127.0.0.1:18081:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: marketplace
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka-init: {condition: service_completed_successfully}
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  auth:
    <<: *app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 15
    command: uvicorn auth_service.main:app --host 0.0.0.0 --port 8001
    environment:
      <<: *env
      OTEL_SERVICE_NAME: auth
    depends_on:
      postgres: {condition: service_healthy}
  catalog-1:
    <<: *app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 15
    command: uvicorn catalog_service.main:app --host 0.0.0.0 --port 8002
    environment:
      <<: *env
      OTEL_SERVICE_NAME: catalog-1
      INSTANCE_ID: catalog-1
  catalog-2:
    <<: *app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 15
    command: uvicorn catalog_service.main:app --host 0.0.0.0 --port 8002
    environment:
      <<: *env
      OTEL_SERVICE_NAME: catalog-2
      INSTANCE_ID: catalog-2
  order:
    <<: *app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 15
    command: uvicorn order_service.main:app --host 0.0.0.0 --port 8003
    depends_on:
      rabbitmq: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    environment:
      <<: *env
      OTEL_SERVICE_NAME: order
  payment:
    <<: *app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 15
    command: uvicorn payment_service.main:app --host 0.0.0.0 --port 8004
    environment:
      <<: *env
      OTEL_SERVICE_NAME: payment
      FAILURE_RATE: ${FAILURE_RATE:-0}
    depends_on:
      rabbitmq: {condition: service_healthy}
  notification:
    <<: *app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"]
      interval: 10s
      timeout: 5s
      retries: 15
    command: uvicorn notification_service.main:app --host 0.0.0.0 --port 8006
    depends_on:
      rabbitmq: {condition: service_healthy}
    environment:
      <<: *env
      OTEL_SERVICE_NAME: notification
  analytics:
    <<: *app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health')"]
      interval: 10s
      timeout: 5s
      retries: 15
    command: uvicorn analytics_service.main:app --host 0.0.0.0 --port 8007
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    environment:
      <<: *env
      OTEL_SERVICE_NAME: analytics
  graphql:
    <<: *app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 10s
      timeout: 5s
      retries: 15
    command: uvicorn graphql_gateway.main:app --host 0.0.0.0 --port 8005
    environment:
      <<: *env
      OTEL_SERVICE_NAME: graphql
  gateway:
    <<: *app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 15
    command: uvicorn api_gateway.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers
    environment:
      <<: *env
      OTEL_SERVICE_NAME: gateway
      REDIS_URL: redis://redis:6379
      RATE_LIMIT: ${RATE_LIMIT:-60}
      RATE_WINDOW: ${RATE_WINDOW:-60}
    depends_on:
      redis: {condition: service_healthy}
      auth: {condition: service_healthy}
  nginx:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:18080:80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      gateway: {condition: service_healthy}

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "marketplace"]
      interval: 3s
      timeout: 3s
      retries: 20
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["127.0.0.1:16686:16686"]
  loki:
    image: grafana/loki:2.9.10
    ports: ["127.0.0.1:13100:3100"]
  promtail:
    image: grafana/promtail:2.9.10
    user: "0"
    command: -config.file=/config.yml
    volumes: ["./observability/promtail.yml:/config.yml:ro","/var/run/docker.sock:/var/run/docker.sock:ro"]
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:19090:9090"]
  grafana:
    image: grafana/grafana:11.3.1
    ports: ["127.0.0.1:13000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes: ["./observability/provisioning:/etc/grafana/provisioning:ro","./observability/dashboards:/dashboards:ro"]

networks:
  default:
    driver: bridge

volumes:
  pg-data:
  app-data:
  kafka-data:
  rabbit-data:
